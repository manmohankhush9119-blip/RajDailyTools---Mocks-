<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RajDailyTools — Test in Progress</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="test">

  <div id="test-root">
    <div class="error-state">Loading exam…</div>
  </div>

  <!-- ============================ Resume modal ============================ -->
  <div class="modal-overlay" id="modal-resume" hidden>
    <div class="modal">
      <div class="modal__head"><h2>Resume your test?</h2></div>
      <div class="modal__body">
        <p>We found an in-progress attempt for <strong id="resume-exam-name"></strong>.</p>
        <p>Progress so far: <span id="resume-progress"></span></p>
        <p>Time remaining when you left: <strong id="resume-time-left"></strong></p>
      </div>
      <div class="modal__foot">
        <button class="btn btn--outline" id="btn-resume-restart">Discard &amp; Start Fresh</button>
        <button class="btn btn--primary" id="btn-resume-continue">Resume Test</button>
      </div>
    </div>
  </div>

  <!-- ========================= Instructions modal ========================== -->
  <div class="modal-overlay" id="modal-instructions" hidden>
    <div class="modal modal--wide">
      <div class="modal__head">
        <h2 id="inst-exam-name">Instructions</h2>
      </div>
      <div class="modal__body">
        <p id="inst-exam-meta" style="color:var(--ink-400);font-size:13px;margin-top:-8px;"></p>
        <ol class="instructions-list" id="inst-list"></ol>

        <div style="margin-top:18px;display:flex;align-items:center;gap:10px;">
          <label for="inst-language" style="font-size:13.5px;font-weight:600;">Choose your language:</label>
          <select id="inst-language"></select>
        </div>

        <label class="check-row">
          <input type="checkbox" id="inst-agree">
          <span>I have read and understood the instructions above, and I am ready to begin the timed test. The timer will start as soon as I click "Start Test".</span>
        </label>
      </div>
      <div class="modal__foot">
        <button class="btn btn--gold" id="btn-start-test" disabled>Start Test</button>
      </div>
    </div>
  </div>

  <!-- ============================ Submit modal ============================= -->
  <div class="modal-overlay" id="modal-submit" hidden>
    <div class="modal">
      <div class="modal__head"><h2>Submit test?</h2></div>
      <div class="modal__body">
        <p>Please review your progress before final submission. This cannot be undone.</p>
        <div class="summary-grid">
          <div class="cell answered"><span class="num" id="submit-answered">0</span><span class="lbl">Answered</span></div>
          <div class="cell not-answered"><span class="num" id="submit-not-answered">0</span><span class="lbl">Not Answered</span></div>
          <div class="cell marked"><span class="num" id="submit-marked">0</span><span class="lbl">Marked</span></div>
          <div class="cell not-visited"><span class="num" id="submit-not-visited">0</span><span class="lbl">Not Visited</span></div>
        </div>
      </div>
      <div class="modal__foot">
        <button class="btn btn--outline" id="btn-cancel-submit">Continue Test</button>
        <button class="btn btn--danger" id="btn-confirm-submit">Submit Test</button>
      </div>
    </div>
  </div>

  <script src="cbt.js"></script>
</body>
</html>
